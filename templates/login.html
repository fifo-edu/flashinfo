<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar — Flash House Info</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head>
<body class="login-page"><main class="login-card"><img src="{{ url_for('static',filename='img/logo-flash-house-info.png') }}" alt="Flash House Info"><h1>Bem-vindo</h1><p>Entre para acessar o Sistema de Balcão</p>{% for cat,msg in get_flashed_messages(with_categories=true) %}<div class="alert alert-{{cat}}">{{msg}}</div>{% endfor %}<form method="post" autocomplete="off"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/><label class="form-label">Login</label><input class="form-control mb-3" name="login" value="" required autofocus autocomplete="new-password" autocapitalize="none" spellcheck="false"><label class="form-label">Senha</label><input class="form-control mb-4" type="password" name="senha" value="" required autocomplete="new-password"><button class="btn btn-brand btn-lg w-100">Entrar</button></form>{% if erro_licenca %}<p class="text-danger fw-semibold mt-3 mb-0">Problemas com sua Licença. Contate o suporte.</p>{% endif %}</main><script>history.replaceState(null,'',location.pathname);document.querySelector('form').reset();window.addEventListener('pageshow',()=>document.querySelector('form').reset());</script></body></html>
