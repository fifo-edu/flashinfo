{% extends 'base.html' %}{% block body %}<div class="page-heading"><div><h1>Meu usuário</h1><p>Altere seu nome e seu nome de usuário (login). Confirme com a senha atual.</p></div></div>
<div class="row"><div class="col-lg-5"><div class="panel"><form method="post" autocomplete="off"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/><label class="form-label">Nome</label><input name="nome" class="form-control mb-3" value="{{ user.nome }}" required><label class="form-label">Nome de usuário (login)</label><input name="login" class="form-control mb-1" value="{{ user.login }}" required autocapitalize="none" spellcheck="false">{% if user.perfil != 'Master' %}<small class="text-muted d-block mb-3">Use o domínio @lojadeenvios.</small>{% else %}<div class="mb-3"></div>{% endif %}<label class="form-label">Senha atual</label><input type="password" name="senha_atual" class="form-control mb-4" required autocomplete="current-password"><button class="btn btn-brand">Salvar</button> <a class="btn btn-outline-secondary" href="{{ url_for('trocar_senha') }}">Trocar senha</a></form></div></div></div>{% endblock %}
