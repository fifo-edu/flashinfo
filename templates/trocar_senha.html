{% extends 'base.html' %}{% block body %}<div class="page-heading"><div><h1>Trocar senha</h1><p>Informe a senha atual e defina a nova.</p></div></div>
<div class="row"><div class="col-lg-5"><div class="panel"><form method="post" autocomplete="off"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/><label class="form-label">Senha atual</label><input type="password" name="senha_atual" class="form-control mb-3" required autocomplete="current-password" autofocus><label class="form-label">Nova senha</label><input type="password" name="senha_nova" class="form-control mb-3" minlength="6" required autocomplete="new-password"><label class="form-label">Confirmar nova senha</label><input type="password" name="confirmacao" class="form-control mb-4" minlength="6" required autocomplete="new-password"><button class="btn btn-brand">Salvar nova senha</button></form></div></div></div>{% endblock %}
