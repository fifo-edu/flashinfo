<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Primeiro acesso — Loja de Envios</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head>
<body class="login-page"><main class="login-card"><img src="{{ url_for('static',filename='img/logo-loja-de-envios.svg') }}" alt="Loja de Envios"><h1>Primeiro acesso</h1><p>Defina a conta Master que vai administrar o sistema</p>{% for cat,msg in get_flashed_messages(with_categories=true) %}<div class="alert alert-{{cat}}">{{msg}}</div>{% endfor %}<form method="post" autocomplete="off"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/><label class="form-label">Nome</label><input class="form-control mb-3" name="nome" value="{{ request.form.nome or '' }}" required autofocus><label class="form-label">Login</label><input class="form-control mb-3" name="login" value="{{ request.form.login or '' }}" required autocapitalize="none" spellcheck="false"><label class="form-label">Senha</label><input class="form-control mb-3" type="password" name="senha" required minlength="8" autocomplete="new-password"><label class="form-label">Confirmar senha</label><input class="form-control mb-4" type="password" name="confirmacao" required minlength="8" autocomplete="new-password"><button class="btn btn-brand btn-lg w-100">Criar conta Master</button></form></main><script>history.replaceState(null,'',location.pathname);</script></body></html>
