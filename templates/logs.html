{% extends 'base.html' %}{% block body %}<div class="page-heading"><div><h1>Log do sistema</h1><p>Últimas 1.000 operações registradas.</p></div></div><div class="panel"><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Data/hora</th><th>Usuário</th><th>Ação</th><th>Detalhes</th></tr></thead><tbody>{% for r in rows %}<tr><td>{{r.criado_em|data_hora_br}}</td><td>{{r.usuario_nome}}</td><td><strong>{{r.acao}}</strong></td><td>{{r.detalhes}}</td></tr>{% else %}<tr><td colspan="4" class="text-center text-muted py-5">Nenhum evento registrado.</td></tr>{% endfor %}</tbody></table></div></div>{% endblock %}
